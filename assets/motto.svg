<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 640 64'
    style='background-color: #00000000;'
    width='640px' height='64px'>

    <style>
@font-face {
  font-family: 'Noto Serif SC';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d0.end'
                    dur='8000ms' fill='remove'
                    values='m0,32 h0 ; m0,32 h640 ; m0,32 h640 ; m0,32 h0' keyTimes='0;0.55;0.8625;1' />
                    </path>
    <text font-family='"Noto Serif SC", monospace' fill='#36BCF7' font-size='24'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            非淡泊无以明志，非宁静无以致远。
        </textPath>
    </text>
</svg>
